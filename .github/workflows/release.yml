name: Release EXE

# 打包與發布走共用的 ShowXD/dev-workflows python-windows-release，與其他專案同一套方式：
#   push main      → 取代 Release 頁面的「main-build」預先發布版（永遠只有最新一份）
#   push v* tag    → 檢查 tag 與 pyproject.toml 版本一致 → 建立正式 Release
#   手動觸發       → 只產出 Actions artifact，可選任何分支
# 這裡只放本專案特有的部分：打包機要裝 VLC、確認 VLC 有打進 exe、用 exe 跑 --check。
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# 同一分支連續更新時，取消還沒跑完的舊建置：它的 exe 已經過時，只會白佔 runner 時間。
# tag 的建置要出貨，一律跑完。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  release:
    uses: ShowXD/dev-workflows/.github/workflows/python-windows-release.yml@main
    with:
      app-name: CCTVWall
      exe-name: CCTVWall.exe

      # 打包機必須裝 VLC，否則做出來的 exe 需要現場電腦自行安裝 VLC。
      prepare: choco install vlc -y --no-progress

      build: |
        $out = uv run build cctv-wall 2>&1 | Tee-Object -Variable captured
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        if (($captured -join "`n") -match 'VLC bundling: DISABLED') {
          Write-Error '打包機找不到 VLC，做出來的 exe 不含 VLC。中止。'
          exit 1
        }

      # 打包後的自我診斷。用 Start-Process 導向檔案而非直接呼叫：
      # exe 是 console=False，__main__._check() 在 sys.stdout is None 時會彈對話框，
      # 在 headless runner 上會一路卡到 job timeout。導向檔案可確保 stdout 有效控制代碼，
      # WaitForExit 的上限則是萬一還是彈窗時的保險。
      verify: |
        $p = Start-Process -FilePath "$env:ASSET" `
                           -ArgumentList '--check' -NoNewWindow -PassThru `
                           -RedirectStandardOutput check.txt -RedirectStandardError check.err
        if (-not $p.WaitForExit(180000)) {
          $p.Kill()
          Write-Error 'CCTVWall.exe --check 逾時 3 分鐘（多半是彈出了對話框）。'
          exit 1
        }
        $report = (Get-Content check.txt -Raw) + (Get-Content check.err -Raw)
        Write-Host $report

        # 硬性條件：VLC 是打包進去的，與 runner 環境無關，沒有就是打包壞了。
        if ($report -notmatch 'libvlc\s*:\s*\d') {
          Write-Error 'exe 沒有回報 libvlc 版本，內含的 VLC 沒打包成功。'
          exit 1
        }

        # 非硬性：strict sync 需要 d3d11 元件註冊成功，runner 是無 GPU 的 VM，
        # 這裡失敗不一定代表 exe 壞掉。標成警告，由實機驗收把關。
        if ($report -notmatch 'strict sync\s*:\s*available') {
          Write-Warning 'runner 上 strict sync 不可用。請務必在實際的 Windows 10 目標機上跑一次 --check 確認。'
        }

      release-notes: |
        單一 EXE，內含 VLC 與 GStreamer 嚴格時間戳同步元件，現場電腦不必安裝任何東西。

        **部署**：把 `CCTVWall.exe` 放到目標資料夾 → 先跑 `CCTVWall.exe --check` →
        把 `workspace.json` 放在 exe 旁邊（可從 `workspace.example.json` 複製修改）。

        詳見 [部署說明](https://github.com/ShowXD/cctv-wall/blob/main/docs/BUILD.md)。
