[project]
name = "cctv-wall"
version = "0.2.0"
description = "Multi-site video wall for RTSP cameras, local files and YouTube"
requires-python = ">=3.11"
dependencies = [
    # Qt Core, Gui and Widgets without the large optional Qt Addons bundle.
    "pyside6-essentials>=6.8",
    "python-vlc>=3.0.20",
    "yt-dlp>=2024.1.1",
]

[project.optional-dependencies]
# Retained for callers that explicitly request the runtime. The default build group
# already includes it, so every release executable supports timestamp sync.
strict-sync = ["gstreamer-bundle>=1.28,<1.29"]

[project.scripts]
cctv-wall = "cctv_wall.__main__:main"
cctv-wall-build = "cctv_wall.build:main"
build = "cctv_wall.build:main"

[dependency-groups]
dev = ["pytest>=8.0"]
# PyInstaller uses Pillow to resize the one-file executable's splash artwork.
# The release build also contains the GStreamer runtime needed by strict timestamp sync.
build = ["pyinstaller>=6.6", "pillow>=10.0", "gstreamer-bundle>=1.28,<1.29"]

[tool.uv]
# `uv sync` and `uv run` include the full release toolchain without extra flags.
default-groups = ["build"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cctv_wall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
